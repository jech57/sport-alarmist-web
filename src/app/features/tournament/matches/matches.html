<ng-container *ngIf="tournament$ | async as tournament">
  <ng-container *ngIf="tournament.teams.quantity >= 2; else noTeams">
    <div class="matches-table">
      <div class="matches-table__header">
        <span><h2>Equipo 1</h2></span>
        <span><h2>Equipo 2</h2></span>
        <span><h2>Hora</h2></span>
        <span><h2>Lugar</h2></span>
        <span><h2>Confirmados</h2></span>
      </div>

      <div class="matches-table__date-group" *ngFor="let entry of tournament.matches | keyvalue">
        <div class="matches-table__date-row">
          <span>{{ formatDate(entry.value.date) }} ({{ entry.value.count }})</span>

          <!-- editar/eliminar fecha, con el mismo gap que row-actions (8px) -->
          <div class="matches-table__row-actions matches-table__row-actions--inline">
            <span class="matches-table__date-edit-wrapper">
              <app-edit-button (edit)="onEditDateClick(entry.value.date); dateDp.open()"></app-edit-button>
              <input
                [matDatepicker]="dateDp"
                [(ngModel)]="editDateValue"
                (dateChange)="onDateChanged(entry.key, $event.value)"
                class="matches-table__hidden-date-input"
              />
            </span>
            <mat-datepicker #dateDp xPosition="start" panelClass="matches-datepicker-panel">
              <mat-datepicker-actions>
                <button mat-button matDatepickerCancel>Cancelar</button>
                <button mat-button matDatepickerApply>OK</button>
              </mat-datepicker-actions>
            </mat-datepicker>

            <!-- TODO: funcionalidad real de eliminar fecha -->
            <app-delete-button></app-delete-button>
          </div>

          <!-- colapsa/expande los partidos de esta fecha -->
          <button
            type="button"
            class="matches-table__icon-btn matches-table__collapse-btn"
            [class.matches-table__collapse-btn--collapsed]="isCollapsed(entry.key)"
            aria-label="Colapsar"
            (click)="toggleCollapse(entry.key)"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <ng-container *ngIf="!isCollapsed(entry.key)">
          <ng-container *ngFor="let match of entry.value.matches | keyvalue">
            <div class="matches-table__match-row" *ngIf="editingMatchId !== match.key">
              <span>{{ match.value.team1 }}</span>
              <span>{{ match.value.team2 }}</span>
              <span>{{ match.value.time }}</span>
              <span>{{ match.value.place }}</span>
              <!-- TODO: calcular confirmados reales cuando exista el roster de jugadores -->
              <span>0/0 | 0/0 = 0/0</span>
              <div class="matches-table__row-actions">
                <!-- TODO: funcionalidad real de eliminar partido -->
                <app-edit-button (edit)="onEditMatch(entry.key, match.key, match.value)"></app-edit-button>
                <app-delete-button></app-delete-button>
              </div>
            </div>
          </ng-container>

          <div class="matches-table__match-form" *ngIf="addingMatchDateId === entry.key">
            <select class="matches-table__select" [(ngModel)]="newMatch.team1">
              <option value="" disabled selected>Equipo 1</option>
              <option *ngFor="let team of teamsFor('team1')" [value]="team">{{ team }}</option>
            </select>

            <select class="matches-table__select" [(ngModel)]="newMatch.team2">
              <option value="" disabled selected>Equipo 2</option>
              <option *ngFor="let team of teamsFor('team2')" [value]="team">{{ team }}</option>
            </select>

            <div class="matches-table__time">
              <input type="text" inputmode="numeric" maxlength="2" placeholder="HH" [(ngModel)]="newMatch.hour" (input)="onlyDigits($event, 'hour')" (blur)="clampHour()" />
              <span>:</span>
              <input type="text" inputmode="numeric" maxlength="2" placeholder="mm" [(ngModel)]="newMatch.minute" (input)="onlyDigits($event, 'minute')" (blur)="clampMinute()" />
              <div class="matches-table__ampm">
                <button type="button" [class.active]="newMatch.ampm === 'AM'" (click)="setAmPm('AM')">AM</button>
                <button type="button" [class.active]="newMatch.ampm === 'PM'" (click)="setAmPm('PM')">PM</button>
              </div>
            </div>

            <input type="text" class="matches-table__text-input" placeholder="Lugar" [(ngModel)]="newMatch.place" />

            <div class="matches-table__row-actions">
              <app-confirm-button (confirm)="confirmAddMatch(entry.key)"></app-confirm-button>
              <app-discard-button (discard)="cancelAddMatch()"></app-discard-button>
            </div>
          </div>

          <div class="matches-table__divider-row">
            <app-add-bar variant="circle" label="Añadir partido" (addClick)="onAddMatch(entry.key)"></app-add-bar>
          </div>
        </ng-container>
      </div>

      <app-add-bar label="Añadir fecha" (addClick)="picker.open()">
        <!-- ancla del datepicker: invisible pero en el mismo lugar que el botón,
             por eso NO usamos display:none (eso rompe el cálculo de posición) -->
        <input
          [matDatepicker]="picker"
          [min]="minDate"
          [(ngModel)]="selectedDate"
          class="matches-table__hidden-date-input"
        />
      </app-add-bar>
      <mat-datepicker #picker panelClass="matches-datepicker-panel" (closed)="onPickerClosed()">
        <mat-datepicker-actions>
          <button mat-button matDatepickerCancel (click)="onCancelClick()">Cancelar</button>
          <button mat-button matDatepickerApply (click)="onApplyClick()">OK</button>
        </mat-datepicker-actions>
      </mat-datepicker>
    </div>
  </ng-container>

  <ng-template #noTeams>
    <p class="matches-empty-text">
      Añade al menos dos equipos para agregar partidos. Para ello dirígete a Equipos.
    </p>
  </ng-template>
</ng-container>
