<nav class="tournament-tabs">
  <button type="button" [class.active]="activeTab === 'partidos'" (click)="setTab('partidos')">Partidos</button>
  <button type="button" [class.active]="activeTab === 'equipos'" (click)="setTab('equipos')">Equipos</button>
  <button type="button" [class.active]="activeTab === 'ajustes'" (click)="setTab('ajustes')">Ajustes</button>
</nav>

<div class="tournament-content" [ngSwitch]="activeTab">
  <app-matches *ngSwitchCase="'partidos'"></app-matches>
  <app-teams *ngSwitchCase="'equipos'"></app-teams>
  <app-settings *ngSwitchCase="'ajustes'"></app-settings>
</div>
