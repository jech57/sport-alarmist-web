<div class="header" [class.header--hero]="!(hasTournaments$ | async)">
  <h1 [class.header__title--hero]="!(hasTournaments$ | async)">Manejo de torneos</h1>

  <app-button
    *ngIf="hasTournaments$ | async"
    class="header__button"
    label="Añadir torneo"
    icon="emoji_events"
    (click)="onAddTournament()"
  ></app-button>
</div>
